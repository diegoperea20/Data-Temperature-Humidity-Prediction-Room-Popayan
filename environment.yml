name: maestria
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.20
  - pip
  - numpy=1.26.4
  - pandas=2.2.3
  - scikit-learn=1.5.2
  - matplotlib=3.9.4
  - scipy=1.15.3
  - seaborn=0.13.2
  - h5py=3.16.0
  - jupyterlab
  - ipykernel
  - pip:
      # Variante CPU por defecto (imagen liviana). Para GPU se sobrescribe
      # con --arg TF_PACKAGE="tensorflow==2.10.0" en el build (ver Dockerfile).
      - tensorflow-cpu==2.10.0
      - keras==2.10.0
